    syncPeriodSelectors();
    renderActiveTab();
  };
});

$("#period").onchange = () => { syncDaySelector(); syncDateRangeUI(); renderActiveTab(); };
$("#day").onchange = () => { syncDateRangeUI(); renderActiveTab(); };
$("#dateFrom").onchange = () => { syncDateRangeUI(); renderActiveTab(); };
$("#dateTo").onchange = () => { syncDateRangeUI(); renderActiveTab(); };
$("#clearDates").onclick = () => {
  $("#dateFrom").value = "";
  $("#dateTo").value = "";
  syncDateRangeUI();
  renderActiveTab();
};

window.exportCSVReport = function() {
  const m = computeMetrics(processedOps);
  if (m.empty || !m.current.length) return toast("No hay operaciones para exportar");
  const headers = ["CREATED AT (UTC)","MONEDA_OP","TYPE","PAYMENT METHOD","FUNDS TO SEND AMOUNT","FUNDS TO RECEIVE AMOUNT","PEER COMMISSION","COMISION_FIJA_USD","GANANCIA_TOTAL_USDC","SERVICE FEE","EXCHANGE RATE"];
  const rows = m.current.map(r => [
    `"${formatDisplayDate(r._created, true)}"`,
    `"${r.Moneda_Op}"`,
    `"${r.Type}"`,
    `"${r["Payment Method"]}"`,
    r["Funds To Send Amount"],
    r["Funds To Receive Amount"],
    r["Peer Commission"],
    r.Comision_Fija_USD,
    r.Ganancia_Total_USDC,
    r["Service Fee"],
    r["Exchange Rate"] || m.rate.eur
  ]);
  const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
  const link = document.createElement("a");
  link.setAttribute("href", encodeURI(csvContent));
  link.setAttribute("download", `AirTM_Historial_Consolidado_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast("CSV descargado con éxito");
};

window.printReport = function() {
  const m = computeMetrics(processedOps);
  if (m.empty || !m.current.length) return toast("No hay operaciones para exportar");

  try {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("Librería jsPDF no disponible");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(2, 132, 199);
    doc.text("Reporte Consolidado P2P (Auditoría de Comisiones) — AirTM Pro Analytics", 14, 15);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.5);
    doc.setTextColor(100, 116, 139);
    const pLabel = m.current[0]?.Periodo_Label || $("#period").value || "Periodo Actual";
    doc.text(
      `Periodo: ${pLabel}  |  Operaciones: ${m.ops}  |  Comisiones USDC: $${m.totalCommUSDC.toFixed(2)}  |  Ganancia Global: €${m.globalEUR.toFixed(2)}  |  TC Ref EUR: ${m.rate.eur.toFixed(3)}`,
      14,
      22
    );

    const headers = [
      [
        "CREATED AT (UTC)",
        "MONEDA",
        "TIPO",
        "MÉTODO DE PAGO",
        "ENVIADO",
        "RECIBIDO",
        "PEER COMM ($)",
        "FIJA ($)",
        "GANANCIA ($)",
        "SERVICE FEE",
        "TC RATE"
      ]
    ];

    const rows = m.current.map(r => [
      formatDisplayDate(r._created, true),
      r.Moneda_Op,
      r.Type,
      r["Payment Method"],
      num(r["Funds To Send Amount"]).toLocaleString("es-ES", { minimumFractionDigits: 2 }),
      num(r["Funds To Receive Amount"]).toLocaleString("es-ES", { minimumFractionDigits: 2 }),
      num(r["Peer Commission"]).toFixed(2),
      num(r.Comision_Fija_USD).toFixed(2),
      num(r.Ganancia_Total_USDC).toFixed(2),
      num(r["Service Fee"]).toFixed(2),
      (r["Exchange Rate"] || r.Net_Exchange_Rate || m.rate.eur).toFixed(2)
    ]);

    doc.autoTable({
      head: headers,
      body: rows,
      startY: 27,
      theme: "grid",
      styles: { fontSize: 7.5, cellPadding: 2, font: "helvetica", textColor: [30, 41, 59] },
      headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7.5 },
      alternateRowStyles: { fillColor: [248, 250, 252] },
      columnStyles: { 8: { fontStyle: "bold", textColor: [16, 185, 129] } }
    });

    const fileName = `AirTM_Reporte_Consolidado_${pLabel.replace(/\s+/g, "_")}.pdf`;
    doc.save(fileName);
    toast("¡PDF generado y descargado correctamente!");
  } catch (err) {
    console.warn("Fallo exportación jsPDF:", err);
    toast("Error generando PDF");
  }
};

  applyTheme(currentTheme);
  syncPeriodSelectors();
  renderActiveTab();
  setTimeout(updateNavIndicator, 150);

  setTimeout(() => {

  }, 350);
});
